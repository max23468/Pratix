[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = true
secure_password_change = false
max_frequency = "1m0s"
# Config locale Supabase CLI per il codice OTP email.
# Nel progetto hosted verificare dal Dashboard il campo Email OTP length, non la lunghezza password.
otp_length = 6
otp_expiry = 3600

[auth.email.template.magic_link]
subject = "Accedi a Pratix"
content_path = "./supabase/templates/magic_link.html"
