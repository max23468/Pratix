name: Quality

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, format and lint
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup npm
        run: npm install --global npm@12.0.2

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check formatting
        shell: bash
        run: |
          base_ref="${GITHUB_BASE_REF:-main}"
          git fetch origin "$base_ref"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            npm run format:check
          else
            PRATIX_FORMAT_BASE="${{ github.event.pull_request.base.sha }}" npm run format:changed:check
          fi

      - name: Check changelog quality
        shell: bash
        run: |
          base_ref="${GITHUB_BASE_REF:-main}"
          git fetch origin "$base_ref"
          diff_base="origin/${base_ref}"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            diff_base="${{ github.event.pull_request.base.sha }}"
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || git diff --name-only "${diff_base}...HEAD" | grep -qx 'CHANGELOG.md'; then
            npm run changelog:check
          else
            echo "CHANGELOG.md not changed."
          fi

      - name: Complete gate
        run: npm run check
