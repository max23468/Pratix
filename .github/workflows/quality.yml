name: Quality

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, format and lint
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verifica variabili Doppler
        id: doppler-vars
        env:
          DOPPLER_PROJECT: ${{ vars.DOPPLER_PROJECT }}
          DOPPLER_CONFIG: ${{ vars.DOPPLER_CONFIG }}
          DOPPLER_TOKEN_PRESENT: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          can_fetch=true
          if [ -z "${DOPPLER_PROJECT:-}" ]; then
            echo "::warning::DOPPLER_PROJECT non impostato"
            can_fetch=false
          fi
          if [ -z "${DOPPLER_CONFIG:-}" ]; then
            echo "::warning::DOPPLER_CONFIG non impostata"
            can_fetch=false
          fi
          if [ -z "${DOPPLER_TOKEN_PRESENT:-}" ]; then
            echo "::notice::DOPPLER_TOKEN assente: il fetch non verrà eseguito."
            can_fetch=false
          fi
          echo "can_fetch=${can_fetch}" >> "$GITHUB_OUTPUT"

      - name: Fetch secrets from Doppler
        if: ${{ steps.doppler-vars.outputs.can_fetch == 'true' }}
        uses: dopplerhq/secrets-fetch-action@v2.0.0
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
          project: ${{ vars.DOPPLER_PROJECT }}
          config: ${{ vars.DOPPLER_CONFIG }}
          inject-env-vars: true

      - name: Check formatting
        shell: bash
        run: |
          base_ref="${GITHUB_BASE_REF:-main}"
          git fetch origin "$base_ref"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            npm run format:check
          else
            PRATIX_FORMAT_BASE="${{ github.event.pull_request.base.sha }}" npm run format:changed:check
          fi

      - name: Check changelog quality
        shell: bash
        run: |
          base_ref="${GITHUB_BASE_REF:-main}"
          git fetch origin "$base_ref"
          diff_base="origin/${base_ref}"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            diff_base="${{ github.event.pull_request.base.sha }}"
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || git diff --name-only "${diff_base}...HEAD" | grep -qx 'CHANGELOG.md'; then
            npm run changelog:check
          else
            echo "CHANGELOG.md not changed."
          fi

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Lint changed source files
        shell: bash
        run: |
          base_ref="${GITHUB_BASE_REF:-main}"
          git fetch origin "$base_ref"
          diff_base="origin/${base_ref}"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            diff_base="${{ github.event.pull_request.base.sha }}"
          fi

          changed_source_files="$(git diff --name-only --diff-filter=ACMR "${diff_base}...HEAD" \
            | grep -E '^((src|scripts|supabase)/.*\.(ts|tsx|js|jsx|mjs|cjs)|vite\.config\.ts|vitest\.config\.ts|vitest\.coverage-global\.config\.ts|eslint\.config\.js)$' \
            || true)"

          if [[ -z "$changed_source_files" ]]; then
            echo "No changed source files to lint."
            exit 0
          fi

          npx eslint $changed_source_files

      - name: Detect dependency changes
        id: dependency-changes
        shell: bash
        run: |
          base_ref="${GITHUB_BASE_REF:-main}"
          git fetch origin "$base_ref"
          diff_base="origin/${base_ref}"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            diff_base="${{ github.event.pull_request.base.sha }}"
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "run_audit=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "${diff_base}...HEAD" \
            | grep -Eq '^(package\.json|package-lock\.json)$'; then
            echo "run_audit=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_audit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Audit dependencies
        if: steps.dependency-changes.outputs.run_audit == 'true'
        run: npm audit --audit-level=moderate
