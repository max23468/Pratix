name: Quality

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, format and lint
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        shell: bash
        run: |
          base_ref="${GITHUB_BASE_REF:-main}"
          git fetch origin "$base_ref"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            npm run format:check
          else
            PRATIX_FORMAT_BASE="${{ github.event.pull_request.base.sha }}" npm run format:changed:check
          fi

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Lint changed source files
        shell: bash
        run: |
          base_ref="${GITHUB_BASE_REF:-main}"
          git fetch origin "$base_ref"
          diff_base="origin/${base_ref}"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            diff_base="${{ github.event.pull_request.base.sha }}"
          fi

          changed_source_files="$(git diff --name-only --diff-filter=ACMR "${diff_base}...HEAD" \
            | grep -E '^((src|scripts|supabase)/.*\.(ts|tsx|js|jsx|mjs|cjs)|vite\.config\.ts|vitest\.config\.ts|vitest\.coverage-global\.config\.ts|eslint\.config\.js)$' \
            || true)"

          if [[ -z "$changed_source_files" ]]; then
            echo "No changed source files to lint."
            exit 0
          fi

          npx eslint $changed_source_files

      - name: Detect dependency changes
        id: dependency-changes
        shell: bash
        run: |
          base_ref="${GITHUB_BASE_REF:-main}"
          git fetch origin "$base_ref"
          diff_base="origin/${base_ref}"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            diff_base="${{ github.event.pull_request.base.sha }}"
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "run_audit=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "${diff_base}...HEAD" \
            | grep -Eq '^(package\.json|package-lock\.json)$'; then
            echo "run_audit=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_audit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Audit dependencies
        if: steps.dependency-changes.outputs.run_audit == 'true'
        run: npm audit --audit-level=moderate
