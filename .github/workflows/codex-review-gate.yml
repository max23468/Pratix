name: Codex review gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, closed, converted_to_draft]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Numero della PR da verificare
        required: true
        type: number

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write

jobs:
  gate:
    name: Aggiorna gate Codex
    if: >-
      (github.event_name != 'issue_comment' || github.event.issue.pull_request) &&
      (github.event_name == 'workflow_dispatch' ||
       github.event_name == 'pull_request_target' ||
       github.event.review.user.login == 'chatgpt-codex-connector[bot]' ||
       github.event.comment.user.login == 'chatgpt-codex-connector[bot]' ||
       (github.event_name == 'issue_comment' &&
        github.event.action != 'deleted' &&
        contains(github.event.comment.body, '@codex review')))
    concurrency:
      group: codex-review-${{ github.event.pull_request.number || github.event.issue.number || inputs.pull_request }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 310
    steps:
      # `pull_request_target` concede scritture anche a Dependabot: eseguiamo solo
      # il codice già presente sul branch predefinito, mai quello della PR.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event.action != 'closed' && github.event.action != 'converted_to_draft'
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: github.event.action != 'closed' && github.event.action != 'converted_to_draft'
        with:
          node-version: 24
      - name: Attendi la review Codex
        if: github.event.action != 'closed' && github.event.action != 'converted_to_draft'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_REQUEST_NUMBER: ${{ inputs.pull_request }}
        run: node scripts/codex-review-gate.mjs
